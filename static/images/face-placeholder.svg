<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Face boundary box with eigen-mesh -->
  <rect x="5" y="5" width="110" height="130" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  
  <!-- Face Contour -->
  <ellipse cx="60" cy="70" rx="36" ry="48" fill="url(#faceGrad)" stroke="#8B5CF6" stroke-width="2" />
  
  <!-- Feature Detection Grid/Landmarks -->
  <circle cx="48" cy="58" r="4" fill="#06B6D4" />
  <circle cx="72" cy="58" r="4" fill="#06B6D4" />
  <line x1="48" y1="58" x2="72" y2="58" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Nose & Mouth Mesh -->
  <polygon points="60,65 56,80 64,80" fill="none" stroke="#8B5CF6" stroke-width="1.5" />
  <line x1="50" y1="95" x2="70" y2="95" stroke="#10B981" stroke-width="2" />
  
  <!-- SVD/PCA Dimension Tag -->
  <rect x="15" y="115" width="90" height="16" rx="4" fill="#1E293B" />
  <text x="60" y="126" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">112x92 px (10,304)</text>
</svg>
